<div class="feedback-container {{CLASS}}">
    <div class="feedback-header">
        <div class="feedback-icon">{{ICON}}</div>
        <h1 class="feedback-title">{{TITLE}}</h1>
        <div class="feedback-points {{POINTS_CLASS}}">
            {{POINTS}} points
        </div>
    </div>

    <div class="feedback-explication">
        <h2>Le saviez-vous ?</h2>
        <p>{{EXPLICATION}}</p>
    </div>

    <div class="feedback-actions">
        {{NEXT_BUTTON}}
    </div>
</div>

<link rel="stylesheet" href="/styles/qcm-rgpd-immersive.css">
<script src="/scripts/qcm-rgpd-immersive.js"></script>
