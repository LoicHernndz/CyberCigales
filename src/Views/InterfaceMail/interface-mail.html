<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail macOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="/assets/macos/InterfaceMail/style.css">
    <link rel="stylesheet" href="/styles/interface-mail.css">
</head>

<body>

    <div class="mail-window">

        <div class="toolbar">
            <div class="toolbar-group">
                <button title="Nouveau message"><i class="fas fa-envelope"></i></button>
                <button title="Supprimer"><i class="fas fa-trash-alt"></i></button>
                <button title="Archiver"><i class="fas fa-archive"></i></button>
            </div>

            <!-- Contrôles du Jeu -->
            <div class="toolbar-game-controls">
                <div class="score-display">Score: <span id="game-score">0</span>/5</div>
                <button id="btn-mark-safe" class="btn-game-action btn-safe">
                    <i class="fas fa-shield-alt"></i> Légitime
                </button>
                <button id="btn-report-phishing" class="btn-game-action btn-phishing">
                    <i class="fas fa-exclamation-triangle"></i> Phishing
                </button>
            </div>
        </div>

        <div class="content-area">

            <div class="sidebar">
                <div class="mailbox-title">Mailboxes</div>
                <ul class="mailbox-list">
                    <li class="active-mailbox" data-mailbox="inbox">
                        <div class="icon-label"><i class="fas fa-inbox"></i> Inbox</div> <span class="count"
                            id="inbox-count">5</span>
                    </li>
                    <li data-mailbox="flagged">
                        <div class="icon-label"><i class="fas fa-flag"></i> Flagged</div>
                    </li>
                    <li data-mailbox="drafts">
                        <div class="icon-label"><i class="fas fa-file-alt"></i> Drafts</div>
                    </li>
                    <li data-mailbox="sent">
                        <div class="icon-label"><i class="fas fa-paper-plane"></i> Sent</div>
                    </li>
                    <li data-mailbox="junk">
                        <div class="icon-label"><i class="fas fa-times-circle"></i> Junk</div>
                    </li>
                    <li data-mailbox="trash">
                        <div class="icon-label"><i class="fas fa-trash-alt"></i> Trash</div>
                    </li>
                </ul>
            </div>

            <div class="email-list-column">
                <div class="sort-bar">
                    Sorted by <strong>Date</strong> <i class="fas fa-caret-down"></i>
                </div>
                <ul id="email-list-container" class="email-list">
                    <!-- Rempli par le JS -->
                </ul>
            </div>

            <div id="reading-pane" class="reading-pane">
                <div class="placeholder">Sélectionnez un email pour le lire...</div>
            </div>

        </div>

        <!-- Modal de Feedback -->
        <div id="feedback-modal" class="modal hidden">
            <div class="modal-content">
                <i id="feedback-icon" class="fas fa-check-circle feedback-icon"></i>
                <h2 id="feedback-title">Résultat</h2>
                <p id="feedback-message">Explication...</p>
                <button class="btn-next" id="btn-next-scenario">
                    Message Suivant <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Écran de fin -->
        <div id="end-screen" class="end-screen hidden">
            <!-- <i class="fas fa-trophy" style="font-size: 64px; color: #ffd700; margin-bottom: 20px;"></i> -->
            <h2>Session Terminée</h2>
            <p style="font-size: 18px; margin: 10px 0;">Votre vigilance a payé.</p>
            <p class="score-display" style="font-size: 24px;">Score Final : <span id="final-score">0</span>/5</p>

            <div id="game-clue-container" style="display:none; width: 100%; max-width: 400px;"></div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-next" style="background-color: #5856d6;" id="btn-continue-game">Continuer</button>
            </div>
        </div>
    </div>

    <script src="/js/mail-game.js"></script>

</body>

</html>
