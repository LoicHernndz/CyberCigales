<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DISPLAY_NAME}} (@{{USERNAME}}) - Instagram Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/normalize.css">
    <link rel="stylesheet" href="/assets/instagram/css/instagram-fixed.css">
    <link rel="stylesheet" href="/assets/instagram/css/instagram-profile.css?v=4">
    <link rel="stylesheet" href="/assets/instagram/css/svg-icons.css">
</head>

<body class="container">
    <!-- Header avec navigation -->
    <header class="header">
        <div class="header_left">
            <a href="{{URL_INSTAGRAM}}" class="icon_button" aria-label="Go Back" title="Retour à l'accueil">
                <img src="/images/instagram/svgs/chevron-back-outline.svg" alt="Retour" class="ionicon">
            </a>
            <h1 class="primary_header">
                {{USERNAME}}
                <span class="access-hidden">Profile</span>
                {{VERIFIED_ICON}}
            </h1>
        </div>
        <div class="header_right">
            <button class="icon_button" aria-label="Notifications" type="button">
                <img src="/images/instagram/svgs/notifications-outline.svg" alt="Notifications" class="ionicon">
            </button>
            <button class="icon_button" type="button">
                <img src="/images/instagram/svgs/ellipsis-horizontal.svg" alt="Menu" class="ionicon">
            </button>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="main">
        <!-- Section profil avec avatar et stats -->
        <div class="profile">
            <figure class="figure">
                <img loading="lazy" src="{{AVATAR}}" alt="{{DISPLAY_NAME}} profile" class="profile-avatar-img" />
            </figure>
            <div class="profile_meta">
                <div class="name">{{DISPLAY_NAME}}</div>
                <div class="meta_count-container">
                    <div class="meta_count">
                        <div class="count">{{POSTS_COUNT}}</div>
                        <div class="type">publications</div>
                    </div>
                    <div class="meta_count">
                        <div class="count">{{FOLLOWERS_COUNT}}</div>
                        <div class="type">abonnés</div>
                    </div>
                    <div class="meta_count">
                        <div class="count">{{FOLLOWING_COUNT}}</div>
                        <div class="type">abonnements</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Description et liens générés dynamiquement -->
        {{PROFILE_INFO}}

        <!-- Section "Followed by" -->
        <div class="followed_by">
            <div class="followed_profiles">
                <figure class="figure">
                    <img loading="lazy" src="/images/instagram/avslagzns-uwdtczj-2zJhA9RSkys-unsplash.jpg"
                        alt="alex_photo" />
                </figure>
                <figure class="figure">
                    <img loading="lazy" src="/images/instagram/anna-bratiychuk-IeNoBmJ011g-unsplash.jpg"
                        alt="anna_food" />
                </figure>
                <figure class="figure">
                    <img loading="lazy" src="/images/instagram/faux-profil-amie-hacke/melina_photo_selfie_salon.png"
                        alt="mel_133" />
                </figure>
            </div>
            <p>
                Suivi par
                <span class="bold">INDISPONIBLE, anna_food</span>
                et
                <span class="bold">12 autres</span>
            </p>
        </div>

        <!-- Boutons d'action -->
        <div class="ctas">
            <button class="button" type="button">Suivre</button>
            <a href="{{CHAT_URL}}" class="button">Message</a>
            <button class="button" type="button">Email</button>
            <button class="button" aria-label="Ajouter au profil" type="button">
                <img src="/images/instagram/svgs/person-add-outline.svg" alt="Ajouter" class="ionicon">
            </button>
        </div>

        <!-- Onglets de navigation -->
        <div class="button_tabs">
            <button class="tab_button active" aria-pressed="true" aria-label="Post Grid" type="button">
                <img src="/images/instagram/svgs/grid.svg" alt="Grid" class="ionicon">
            </button>
            <button class="tab_button" aria-label="Reels" type="button">
                <img src="/images/instagram/svgs/videocam-outline.svg" alt="Reels" class="ionicon">
            </button>
            <button class="tab_button" aria-label="Remix" type="button">
                <img src="/images/instagram/svgs/repeat-outline.svg" alt="Remix" class="ionicon">
            </button>
            <button class="tab_button" aria-label="Tagged" type="button">
                <img src="/images/instagram/svgs/person-circle-outline.svg" alt="Tagged" class="ionicon">
            </button>
        </div>

        <!-- Grille des posts -->
        <div class="post_grid">
            {{POSTS}}
        </div>
    </main>

    <!-- Navigation du bas -->
    <footer class="footer">
        <a href="{{URL_INSTAGRAM}}" class="tab_button" aria-label="Accueil" title="Retour à l'accueil">
            <img src="/images/instagram/svgs/home-sharp.svg" alt="Accueil" class="ionicon">
        </a>
        <button class="tab_button" aria-label="Recherche" type="button">
            <img src="/images/instagram/svgs/search.svg" alt="Recherche" class="ionicon">
        </button>
        <button class="tab_button" aria-label="Ajouter du contenu" type="button">
            <img src="/images/instagram/svgs/add-circle-outline.svg" alt="Ajouter" class="ionicon">
        </button>
        <button class="tab_button" aria-label="Reels" type="button">
            <img src="/images/instagram/svgs/videocam-outline.svg" alt="Reels" class="ionicon">
        </button>
        <button class="tab_button" aria-label="Profil utilisateur actuel" type="button">
            <figure class="figure">
                <img src="{{AVATAR}}" alt="Profil {{USERNAME}}" />
            </figure>
        </button>
    </footer>

    <!-- Script UI Notifications -->
    <script src="/assets/instagram/js/instagram-ui.js?v=2"></script>
</body>

</html>
