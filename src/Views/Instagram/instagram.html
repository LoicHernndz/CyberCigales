<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Configuration de base pour la page Instagram mobile -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <!-- Préchargement des polices Google Fonts pour de meilleures performances -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="/styles/normalize.css"> <!-- Reset CSS pour la cohérence cross-browser -->
    <link rel="stylesheet" href="/assets/instagram/css/instagram-fixed.css"> <!-- Styles Instagram corrigés -->
    <link rel="stylesheet" href="/assets/instagram/css/svg-icons.css"> <!-- Styles pour les icônes SVG -->
</head>

<body>
    <div class="instagram-container">
        <!-- ======================================== -->
        <!-- HEADER INSTAGRAM -->
        <!-- ======================================== -->
        <!-- En-tête fixe avec logo et actions (messages, notifications) -->
        <header class="instagram-header">
            <div class="header-content">
                <!-- Logo Instagram personnalisé -->
                <h1 class="logo">
                    <img src="/images/instagram/faux-profil-amie-hacke/logo-instagram et ecriture.png" alt="Instagram">
                </h1>

                <!-- Actions du header (messages et notifications) -->
                <div class="header-actions">
                    <button class="icon-btn" aria-label="Messages directs">
                        <img src="/images/instagram/svgs/chatbubbles-outline.svg" alt="Messages" class="icon">
                    </button>
                    <button class="icon-btn" aria-label="Notifications">
                        <img src="/images/instagram/svgs/notifications-outline.svg" alt="Notifications" class="icon">
                    </button>
                </div>
            </div>
        </header>

        <!-- ======================================== -->
        <!-- CONTENU PRINCIPAL -->
        <!-- ======================================== -->
        <main class="main-content">
            <!-- ======================================== -->
            <!-- SECTION STORIES -->
            <!-- ======================================== -->
            <!-- Section horizontale avec les avatars des stories -->
            <section class="stories-section">
                <div class="stories-container">
                    <!-- Story de l'utilisateur connecté (avec icône +) -->
                    <div class="story-item">
                        <div class="story-avatar your-story">
                            <img src="images/heidisheltie.jpg" alt="Votre story">
                            <div class="add-story-icon">+</div>
                        </div>
                        <span class="story-username">Votre story</span>
                    </div>

                    <!-- Stories dynamiques -->
                    {{STORIES}}
                </div>
            </section>

            <!-- ======================================== -->
            <!-- FEED POSTS -->
            <!-- ======================================== -->
            <div class="feed-container">
                {{POSTS}}
            </div>

            <!-- ======================================== -->
            <!-- NAVIGATION DU BAS -->
            <!-- ======================================== -->
            <!-- Barre de navigation fixe en bas (comme Instagram mobile) -->
            <nav class="bottom-nav">
                <!-- Bouton Accueil (actif) -->
                <button class="nav-btn active" aria-label="Accueil">
                    <img src="/images/instagram/svgs/home-sharp.svg" alt="Accueil" class="icon">
                </button>

                <!-- Bouton Recherche -->
                <button class="nav-btn" aria-label="Recherche">
                    <img src="/images/instagram/svgs/search.svg" alt="Recherche" class="icon">
                </button>

                <!-- Bouton Ajouter du contenu -->
                <button class="nav-btn" aria-label="Ajouter">
                    <img src="/images/instagram/svgs/add-circle-outline.svg" alt="Ajouter" class="icon">
                </button>

                <!-- Bouton Reels -->
                <button class="nav-btn" aria-label="Reels">
                    <img src="/images/instagram/svgs/videocam-outline.svg" alt="Reels" class="icon">
                </button>

                <!-- Bouton Profil (avec avatar) -->
                <button class="nav-btn" id="btn-profile-switch" aria-label="Profil">
                    <img src="images/heidisheltie.jpg" alt="Profil" class="profile-nav-img">
                </button>
            </nav>
        </main>
    </div>

    <!-- Modal de connexion Instagram -->
    <div class="insta-login-overlay hidden" id="insta-login-overlay">
        <div class="insta-login-modal">
            <div class="insta-login-header">
                <img src="/images/instagram/faux-profil-amie-hacke/logo-instagram et ecriture.png" alt="Instagram"
                    class="insta-login-logo">
                <p class="insta-login-subtitle">Connectez-vous à un autre compte</p>
            </div>
            <div class="insta-login-error hidden" id="insta-login-error">
                Identifiants incorrects. Réessayez.
            </div>
            <div class="insta-login-form">
                <input type="text" id="insta-login-username" placeholder="Nom d'utilisateur" autocomplete="off">
                <input type="password" id="insta-login-password" placeholder="Mot de passe">
                <button class="insta-login-btn" id="insta-login-submit">Se connecter</button>
            </div>
            <button class="insta-login-cancel" id="insta-login-cancel">Annuler</button>
        </div>
    </div>

    <style>
        .insta-login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            animation: fadeIn 0.2s ease;
        }

        .insta-login-overlay.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .insta-login-modal {
            background: #fff;
            border-radius: 12px;
            padding: 30px 24px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .insta-login-header {
            margin-bottom: 20px;
        }

        .insta-login-logo {
            height: 45px;
            margin-bottom: 10px;
        }

        .insta-login-subtitle {
            color: #8e8e8e;
            font-size: 14px;
            margin: 0;
        }

        .insta-login-error {
            background: #ed4956;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            animation: shake 0.4s ease;
        }

        .insta-login-error.hidden {
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        .insta-login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .insta-login-form input {
            padding: 12px 14px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .insta-login-form input:focus {
            border-color: #a8a8a8;
            background: #fff;
        }

        .insta-login-btn {
            padding: 12px;
            background: #0095f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .insta-login-btn:hover {
            background: #1877f2;
        }

        .insta-login-cancel {
            background: none;
            border: none;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
            font-family: 'Inter', sans-serif;
        }

        .insta-login-cancel:hover {
            color: #00376b;
        }
    </style>

    <!-- Script Account Switch -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('insta-login-overlay');
            const usernameIn = document.getElementById('insta-login-username');
            const passwordIn = document.getElementById('insta-login-password');
            const errorBox = document.getElementById('insta-login-error');
            const btnProfile = document.getElementById('btn-profile-switch');
            const btnSubmit = document.getElementById('insta-login-submit');
            const btnCancel = document.getElementById('insta-login-cancel');

            // Ouvrir la modale
            btnProfile.addEventListener('click', () => {
                overlay.classList.remove('hidden');
                usernameIn.value = '';
                passwordIn.value = '';
                errorBox.classList.add('hidden');
                setTimeout(() => usernameIn.focus(), 100);
            });

            // Fermer la modale
            btnCancel.addEventListener('click', () => overlay.classList.add('hidden'));
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.add('hidden');
            });

            // Validation
            function tryLogin() {
                const user = usernameIn.value.trim().toLowerCase();
                const pass = passwordIn.value.toLowerCase();

                if (user === 'mel_133' && pass === 'marseille14042018') {
                    overlay.classList.add('hidden');
                    window.location.href = '/instagram/user/mel_133';
                } else {
                    errorBox.classList.remove('hidden');
                    errorBox.style.animation = 'none';
                    errorBox.offsetHeight;
                    errorBox.style.animation = '';
                    passwordIn.value = '';
                    passwordIn.focus();
                }
            }

            btnSubmit.addEventListener('click', tryLogin);
            [usernameIn, passwordIn].forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') tryLogin();
                    if (e.key === 'Escape') overlay.classList.add('hidden');
                });
            });
        });
    </script>

    <!-- Script UI Notifications -->
    <script src="/assets/instagram/js/instagram-ui.js?v=2"></script>
</body>

</html>
