<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Configuration de base pour la page Instagram mobile -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <!-- Préchargement des polices Google Fonts pour de meilleures performances -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="/styles/normalize.css"> <!-- Reset CSS pour la cohérence cross-browser -->
    <link rel="stylesheet" href="/assets/instagram/css/instagram-fixed.css?v=2"> <!-- Styles Instagram corrigés -->
    <link rel="stylesheet" href="/assets/instagram/css/svg-icons.css"> <!-- Styles pour les icônes SVG -->
    <link rel="stylesheet" href="/assets/instagram/css/instagram-login.css?v=2"> <!-- Styles modale de connexion -->
</head>

<body>
    <div class="instagram-container">
        <!-- ======================================== -->
        <!-- HEADER INSTAGRAM -->
        <!-- ======================================== -->
        <!-- En-tête fixe avec logo et actions (messages, notifications) -->
        <header class="instagram-header">
            <div class="header-content">
                <!-- Logo Instagram personnalisé -->
                <h1 class="logo">
                    <img src="/images/instagram/faux-profil-amie-hacke/logo-instagram et ecriture.png" alt="Instagram">
                </h1>

                <!-- Actions du header (messages et notifications) -->
                <div class="header-actions">
                    <button class="icon-btn" aria-label="Messages directs">
                        <img src="/images/instagram/svgs/chatbubbles-outline.svg" alt="Messages" class="icon">
                    </button>
                    <button class="icon-btn" aria-label="Notifications">
                        <img src="/images/instagram/svgs/notifications-outline.svg" alt="Notifications" class="icon">
                    </button>
                </div>
            </div>
        </header>

        <!-- ======================================== -->
        <!-- CONTENU PRINCIPAL -->
        <!-- ======================================== -->
        <main class="main-content">
            <!-- ======================================== -->
            <!-- SECTION STORIES -->
            <!-- ======================================== -->
            <!-- Section horizontale avec les avatars des stories -->
            <section class="stories-section">
                <button class="stories-arrow stories-arrow-left" id="stories-arrow-left" aria-label="Défiler à gauche">&#8249;</button>
                <div class="stories-container" id="stories-container">
                    <!-- Story de l'utilisateur connecté (avec icône +) -->
                    <div class="story-item">
                        <div class="story-avatar your-story">
                            <img src="images/heidisheltie.jpg" alt="Votre story">
                            <div class="add-story-icon">+</div>
                        </div>
                        <span class="story-username">Votre story</span>
                    </div>

                    <!-- Stories dynamiques -->
                    {{STORIES}}
                </div>
                <button class="stories-arrow stories-arrow-right" id="stories-arrow-right" aria-label="Défiler à droite">&#8250;</button>
            </section>

            <!-- ======================================== -->
            <!-- FEED POSTS -->
            <!-- ======================================== -->
            <div class="feed-container">
                {{POSTS}}
            </div>

            <!-- ======================================== -->
            <!-- NAVIGATION DU BAS -->
            <!-- ======================================== -->
            <!-- Barre de navigation fixe en bas (comme Instagram mobile) -->
            <nav class="bottom-nav">
                <!-- Bouton Accueil (actif) -->
                <button class="nav-btn active" aria-label="Accueil">
                    <img src="/images/instagram/svgs/home-sharp.svg" alt="Accueil" class="icon">
                </button>

                <!-- Bouton Recherche -->
                <button class="nav-btn" aria-label="Recherche">
                    <img src="/images/instagram/svgs/search.svg" alt="Recherche" class="icon">
                </button>

                <!-- Bouton Ajouter du contenu -->
                <button class="nav-btn" aria-label="Ajouter">
                    <img src="/images/instagram/svgs/add-circle-outline.svg" alt="Ajouter" class="icon">
                </button>

                <!-- Bouton Reels -->
                <button class="nav-btn" aria-label="Reels">
                    <img src="/images/instagram/svgs/videocam-outline.svg" alt="Reels" class="icon">
                </button>

                <!-- Bouton Profil (avec avatar) -->
                <button class="nav-btn" id="btn-profile-switch" aria-label="Profil">
                    <img src="images/heidisheltie.jpg" alt="Profil" class="profile-nav-img">
                </button>
            </nav>
        </main>
    </div>

    <!-- Modal de connexion Instagram -->
    <div class="insta-login-overlay hidden" id="insta-login-overlay">
        <div class="insta-login-modal">
            <div class="insta-login-header">
                <img src="/images/instagram/faux-profil-amie-hacke/logo-instagram et ecriture.png" alt="Instagram"
                    class="insta-login-logo">
                <p class="insta-login-subtitle">Connectez-vous à un autre compte</p>
            </div>
            <div class="insta-login-error hidden" id="insta-login-error">
                Identifiants incorrects. Réessayez.
            </div>
            <div class="insta-login-form">
                <input type="text" id="insta-login-username" placeholder="Nom d'utilisateur" autocomplete="off">
                <input type="password" id="insta-login-password" placeholder="Mot de passe">
                <button class="insta-login-btn" id="insta-login-submit">Se connecter</button>
            </div>
            <button class="insta-login-cancel" id="insta-login-cancel">Annuler</button>
        </div>
    </div>

    <!-- Script Account Switch -->
    <script src="/assets/instagram/js/instagram-login.js?v=5"></script>

    <!-- Script UI Notifications -->
    <script src="/assets/instagram/js/instagram-ui.js?v=2"></script>

    <!-- Script Stories scroll arrows -->
    <script>
    (function() {
        var container = document.getElementById('stories-container');
        var leftBtn = document.getElementById('stories-arrow-left');
        var rightBtn = document.getElementById('stories-arrow-right');
        if (!container || !leftBtn || !rightBtn) return;

        function updateArrows() {
            leftBtn.classList.toggle('visible', container.scrollLeft > 0);
            rightBtn.classList.toggle('visible', container.scrollLeft < container.scrollWidth - container.clientWidth - 1);
        }

        leftBtn.addEventListener('click', function() {
            container.scrollBy({ left: -200, behavior: 'smooth' });
        });
        rightBtn.addEventListener('click', function() {
            container.scrollBy({ left: 200, behavior: 'smooth' });
        });

        container.addEventListener('scroll', updateArrows);
        window.addEventListener('resize', updateArrows);
        updateArrows();
    })();
    </script>
</body>

</html>
