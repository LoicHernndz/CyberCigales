<link rel="stylesheet" href="/styles/auth.css">

<div class="auth-container auth-container-large">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons">person_add</span>
            </div>
            <h1>Inscription</h1>
            <p class="auth-subtitle">Créez votre compte et commencez votre formation en cybersécurité</p>
        </div>

        {{FLASH}}

        <form method="post" action="/user/signup" class="auth-form">
            <input type="hidden" name="type" value="register">

            <div class="form-row">
                <div class="form-group">
                    <label for="prenom">
                        <span class="material-icons">badge</span>
                        Prénom
                    </label>
                    <input 
                        type="text" 
                        name="prenom" 
                        id="prenom"
                        placeholder="Votre prénom"
                        required
                        autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="nom">
                        <span class="material-icons">badge</span>
                        Nom
                    </label>
                    <input 
                        type="text" 
                        name="nom" 
                        id="nom"
                        placeholder="Votre nom"
                        required
                        autocomplete="family-name">
                </div>
            </div>

            <div class="form-group">
                <label for="pseudo">
                    <span class="material-icons">alternate_email</span>
                    Pseudo
                </label>
                <input 
                    type="text" 
                    name="pseudo" 
                    id="pseudo"
                    placeholder="Choisissez un pseudo unique"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">
                    <span class="material-icons">email</span>
                    Adresse e-mail
                </label>
                <input 
                    type="email" 
                    name="email" 
                    id="email"
                    placeholder="votre.email@exemple.com"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">
                    <span class="material-icons">lock</span>
                    Mot de passe
                </label>
                <input 
                    type="password" 
                    name="password" 
                    id="password"
                    placeholder="Minimum 8 caractères"
                    required
                    minlength="8"
                    autocomplete="new-password">
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <p class="strength-text" id="strengthText">Entrez un mot de passe</p>
                </div>
            </div>

            <div class="form-group">
                <label for="password_repeat">
                    <span class="material-icons">lock_outline</span>
                    Confirmer le mot de passe
                </label>
                <input 
                    type="password" 
                    name="password_repeat" 
                    id="password_repeat"
                    placeholder="Répétez le mot de passe"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="captcha_code">
                    <span class="material-icons">security</span>
                    Copiez le code de sécurité
                </label>
                <div class="captcha-container">
                    <a href="/user/signup" aria-label="Rafraîchir le code">
                        <img src="/captcha?ts={{CAPTCHA_TS}}" alt="Captcha" class="captcha-img" />
                    </a>
                    <a class="btn-captcha-refresh" href="/user/signup" aria-label="Rafraîchir le code">
                        <span class="material-icons">refresh</span>
                    </a>
                </div>
                <input
                    type="text"
                    name="captcha_code"
                    id="captcha_code"
                    placeholder="Recopiez le code affiché"
                    required
                    autocomplete="off"
                    inputmode="latin">
            </div>

            <div class="form-checkbox">
                <input 
                    type="checkbox" 
                    name="accept_mentions" 
                    id="accept_mentions" 
                    value="1"
                    required>
                <label for="accept_mentions">
                    J'ai lu et j'accepte les <a href="/mentions">mentions légales</a>
                </label>
            </div>

            <button type="submit" name="submit" class="btn-auth btn-primary">
                <span class="material-icons">how_to_reg</span>
                <span>Créer mon compte</span>
            </button>

            <div class="auth-footer">
                <p>Vous avez déjà un compte ?</p>
                <a href="/user/login" class="link-secondary">
                    <span class="material-icons">login</span>
                    Se connecter
                </a>
            </div>
        </form>
    </div>
</div>

<script>
// Validation du mot de passe en temps réel
const pwdInput = document.getElementById('password');
const pwdRepeat = document.getElementById('password_repeat');
const strengthFill = document.getElementById('strengthFill');
const strengthText = document.getElementById('strengthText');

if (pwdInput) {
    pwdInput.addEventListener('input', function() {
        const password = this.value;
        let strength = 0;
        
        // Critères de validation
        if (password.length >= 8) strength += 25;
        if (/[A-Z]/.test(password)) strength += 25;
        if (/[a-z]/.test(password)) strength += 25;
        if (/[0-9]/.test(password)) strength += 25;
        
        // Mise à jour de la barre de force
        strengthFill.style.width = strength + '%';
        
        if (strength === 0) {
            strengthFill.className = 'strength-fill';
            strengthText.textContent = 'Entrez un mot de passe';
        } else if (strength <= 25) {
            strengthFill.className = 'strength-fill weak';
            strengthText.textContent = 'Mot de passe faible';
        } else if (strength <= 50) {
            strengthFill.className = 'strength-fill medium';
            strengthText.textContent = 'Mot de passe moyen';
        } else if (strength <= 75) {
            strengthFill.className = 'strength-fill good';
            strengthText.textContent = 'Bon mot de passe';
        } else {
            strengthFill.className = 'strength-fill strong';
            strengthText.textContent = 'Mot de passe fort';
        }
    });
}

// Validation de la confirmation
if (pwdRepeat) {
    pwdRepeat.addEventListener('input', function() {
        if (this.value !== pwdInput.value) {
            this.setCustomValidity('Les mots de passe ne correspondent pas');
        } else {
            this.setCustomValidity('');
        }
    });
}
</script>
