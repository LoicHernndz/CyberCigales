<div class="auth-container auth-container-large">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons">person_add</span>
            </div>
            <h1>Inscription</h1>
            <p class="auth-subtitle">Créez votre compte et commencez votre formation en cybersécurité</p>
        </div>

        {{FLASH}}

        <form method="post" action="{{URL_SIGNUP}}" class="auth-form">
            <input type="hidden" name="type" value="register">

            <div class="form-row">
                <div class="form-group">
                    <label for="prenom">
                        <span class="material-icons">badge</span>
                        Prénom
                    </label>
                    <input 
                        type="text" 
                        name="prenom" 
                        id="prenom"
                        placeholder="Votre prénom"
                        required
                        autocomplete="given-name">
                </div>

                <div class="form-group">
                    <label for="nom">
                        <span class="material-icons">badge</span>
                        Nom
                    </label>
                    <input 
                        type="text" 
                        name="nom" 
                        id="nom"
                        placeholder="Votre nom"
                        required
                        autocomplete="family-name">
                </div>
            </div>

            <div class="form-group">
                <label for="pseudo">
                    <span class="material-icons">alternate_email</span>
                    Pseudo
                </label>
                <input 
                    type="text" 
                    name="pseudo" 
                    id="pseudo"
                    placeholder="Choisissez un pseudo unique"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="email">
                    <span class="material-icons">email</span>
                    Adresse e-mail
                </label>
                <input 
                    type="email" 
                    name="email" 
                    id="email"
                    placeholder="votre.email@exemple.com"
                    required
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">
                    <span class="material-icons">lock</span>
                    Mot de passe
                </label>
                <input 
                    type="password" 
                    name="password" 
                    id="password"
                    placeholder="Minimum 8 caractères"
                    required
                    minlength="8"
                    autocomplete="new-password">
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <p class="strength-text" id="strengthText">Entrez un mot de passe</p>
                </div>
            </div>

            <div class="form-group">
                <label for="password_repeat">
                    <span class="material-icons">lock_outline</span>
                    Confirmer le mot de passe
                </label>
                <input 
                    type="password" 
                    name="password_repeat" 
                    id="password_repeat"
                    placeholder="Répétez le mot de passe"
                    required
                    minlength="8"
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="captcha_code">
                    <span class="material-icons">security</span>
                    Copiez le code de sécurité
                </label>
                <div class="captcha-container">
                    <img src="/captcha?ts={{CAPTCHA_TS}}" alt="Captcha" class="captcha-img" id="captcha-img" />
                    <button type="button" class="btn-captcha-refresh" aria-label="Rafraîchir le code">
                        <span class="material-icons">refresh</span>
                    </button>
                </div>
                <input
                    type="text"
                    name="captcha_code"
                    id="captcha_code"
                    placeholder="Recopiez le code affiché"
                    required
                    autocomplete="off"
                    inputmode="latin">
            </div>

            <div class="form-checkbox">
                <input 
                    type="checkbox" 
                    name="accept_mentions" 
                    id="accept_mentions" 
                    value="1"
                    required>
                <label for="accept_mentions">
                    J'ai lu et j'accepte les <a href="{{URL_MENTIONS}}">mentions légales</a>
                </label>
            </div>

            <button type="submit" name="submit" class="btn-auth btn-primary">
                <span class="material-icons">how_to_reg</span>
                <span>Créer mon compte</span>
            </button>

            <div class="auth-footer">
                <p>Vous avez déjà un compte ?</p>
                <a href="{{URL_LOGIN}}" class="link-secondary">
                    <span class="material-icons">login</span>
                    Se connecter
                </a>
            </div>
        </form>
    </div>
</div>

<script src="/js/captcha-refresh.js"></script>
<script src="/js/password-strength.js"></script>
