<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons">login</span>
            </div>
            <h1>Connexion</h1>
            <p class="auth-subtitle">Accédez à votre espace de formation en cybersécurité</p>
        </div>

        {{FLASH}}

        <form method="post" action="{{URL_LOGIN}}" class="auth-form">
            <input type="hidden" name="type" value="login">
            
            <div class="form-group">
                <label for="name-email">
                    <span class="material-icons">person</span>
                    Pseudo ou E-mail
                </label>
                <input 
                    type="text" 
                    name="name/email" 
                    id="name-email"
                    placeholder="Entrez votre pseudo ou email"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">
                    <span class="material-icons">lock</span>
                    Mot de passe
                </label>
                <input 
                    type="password" 
                    name="password" 
                    id="password"
                    placeholder="Entrez votre mot de passe"
                    required
                    autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="captcha_code">
                    <span class="material-icons">security</span>
                    Copiez le code de sécurité
                </label>
                <div class="captcha-container">
                    <img src="/captcha?ts={{CAPTCHA_TS}}" alt="Captcha" class="captcha-img" id="captcha-img" />
                    <button type="button" class="btn-captcha-refresh" aria-label="Rafraîchir le code">
                        <span class="material-icons">refresh</span>
                    </button>
                </div>
                <input 
                    type="text" 
                    name="captcha_code" 
                    id="captcha_code"
                    placeholder="Recopiez le code affiché"
                    required
                    autocomplete="off"
                    inputmode="latin">
            </div>

            <button type="submit" name="submit" class="btn-auth btn-primary">
                <span class="material-icons">login</span>
                <span>Se connecter</span>
            </button>

            <div class="auth-links">
                <a href="{{URL_RESET_PASSWORD}}" class="link-forgot">
                    <span class="material-icons">help_outline</span>
                    Mot de passe oublié ?
                </a>
            </div>

            <div class="auth-footer">
                <p>Pas encore de compte ?</p>
                <a href="{{URL_SIGNUP}}" class="link-secondary">
                    <span class="material-icons">person_add</span>
                    Créer un compte
                </a>
            </div>
        </form>
    </div>
</div>

<script src="/assets/js/captcha-refresh.js"></script>
