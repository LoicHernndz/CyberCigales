<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons">lock_reset</span>
            </div>
            <h1>Réinitialisation</h1>
            <p class="auth-subtitle">Entrez votre email pour recevoir le lien</p>
        </div>

        {{FLASH}}

        <form method="post" action="/user/reset-password" class="auth-form">
            <input type="hidden" name="type" value="send">

            <div class="form-group">
                <label for="usersEmail">
                    <span class="material-icons">email</span>
                    Adresse e-mail
                </label>
                <input
                        type="email"
                        name="usersEmail"
                        id="usersEmail"
                        placeholder="votre.email@exemple.com"
                        required
                        autocomplete="email">
            </div>

            <button type="submit" name="submit" class="btn-auth">
                <span class="material-icons">send</span>
                <span>Envoyer le lien</span>
            </button>

            <div class="info-box info-box-spaced">
                <span class="material-icons">help_outline</span>
                <p>Si vous ne recevez pas l'email, pensez à vérifier votre dossier <strong>Spam</strong>.</p>
            </div>

            <div class="auth-footer">
                <p>Vous vous souvenez de votre mot de passe ?</p>
                <a href="/user/login" class="auth-link-back">
                    <span class="material-icons icon-small">arrow_back</span>
                    Retour à la connexion
                </a>
            </div>
        </form>
    </div>
</div>
