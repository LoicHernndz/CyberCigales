<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS — Écran de verrouillage</title>
    <link rel="stylesheet" href="/styles/macos-lock.css">
</head>

<body class="macos-lock">

    <!-- Barre de menu macOS -->
    <div class="macos-menubar">
        <div class="macos-menubar-time">
            <span class="macos-menubar-icon">🔒</span>
            <span id="current-time"></span>
        </div>
    </div>

    <!-- Fond animé avec flou -->
    <div class="lock-bg-blur"></div>

    <!-- Container de connexion -->
    <div class="login-container">

        <!-- Icône cadenas / avatar -->
        <div class="lock-icon">🔒</div>

        <!-- Nom -->
        <div class="user-name">Élève</div>

        <!-- Sous-titre -->
        <div class="lock-subtitle">
            Connectez-vous à votre compte CyberCigales<br>pour accéder à l'escape game.
        </div>

        <!-- Bouton de connexion -->
        <a href="/user/login?redirect=/macos" class="login-btn" id="loginBtn">
            <span class="login-btn-icon">→</span>
            Se connecter
        </a>

    </div>

    <!-- Heure en grand au centre bas -->
    <div class="lock-clock">
        <div class="lock-clock-time" id="lock-big-time"></div>
        <div class="lock-clock-date" id="lock-big-date"></div>
    </div>

    <script src="/assets/macos/js/macos-lock.js"></script>
</body>

</html>
