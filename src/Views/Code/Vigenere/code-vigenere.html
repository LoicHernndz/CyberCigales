<link rel="stylesheet" href="/styles/auth.css">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons"></span>
            </div>
            <h1>Chiffrement Vigenère</h1>
            <p class="auth-subtitle">Testez votre capacité à déchiffrer un message !</p>
        </div>

        {{FLASH}}

        <form method="post" action="/code/chiffrement-vigenere" class="auth-form">
            <input type="hidden" name="type" value="login">

            <div class="form-group">
                <label for="word-vigenere">
                    Entrez le mot ou la phrase que vous souhaitez chiffrer avec le chiffre Vigenère :
                </label>
                <input
                        type="text"
                        name="word-vigenere"
                        id="word-vigenere"
                        placeholder="Entrez le mot ou la phrase ici"
                        required
                        autocomplete="username">
            </div>

            <div class="form-group">
                <label for="key-vigenere">
                    Entrez la clé que vous souhaitez utiliser pour le chiffrement de Vigenère :
                </label>
                <input
                        type="text"
                        name="key-vigenere"
                        id="key-vigenere"
                        placeholder="Entrez le décalage ici"
                        required
                        autocomplete="username">
            </div>

            <div class="form-group">
                <label for="word-vigenere-verify">
                    Entrez le code chiffré du mot ou de la phrase que vous avez rentré précédemment pour vérifier votre chiffrement :
                </label>
                <input
                        type="text"
                        name="word-vigenere-verify"
                        id="word-vigenere-verify"
                        placeholder="Entrez le code chiffré ici"
                        required
                        autocomplete="username">
            </div>

            <button type="submit" name="submit" class="btn-auth btn-primary" id="btn-submit">
                <span>Vérifier</span>
            </button>
        </form>
    </div>
</div>
