<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <span class="material-icons"></span>
            </div>
            <h1>Déchiffrement par Permutation</h1>
            <p class="auth-subtitle">Testez votre capacité à déchiffrer un message !</p>
        </div>

        {{FLASH}}

        <form method="post" action="/code/dechiffrement-permutation" class="auth-form">
            <input type="hidden" name="type" value="">

            <div class="form-group">
                <label for="word-permutation">
                    Entrez le mot ou la phrase que vous souhaitez déchiffrer par Permutation :
                </label>
                <input
                        type="text"
                        name="word-permutation"
                        id="word-permutation"
                        placeholder="Entrez le mot ou la phrase ici"
                        required
                        autocomplete="username">
            </div>

            <div class="form-group">
                <label for="key-permutation">
                    Entrez la clé que vous souhaitez utiliser pour le déchiffrer :
                </label>
                <input
                        type="text"
                        name="key-permutation"
                        id="key-permutation"
                        placeholder="Entrez le code chiffré ici"
                        required
                        autocomplete="username">
            </div>

            <div class="form-group">
                <label for="word-permutation-verify">
                    Entrez le code déchiffré pour vérifier si vous l'avez bien décrypté :
                </label>
                <input
                        type="text"
                        name="word-permutation-verify"
                        id="word-permutation-verify"
                        placeholder="Entrez le code chiffré ici"
                        required
                        autocomplete="username">
            </div>

            <button type="submit" name="submit" class="btn-auth btn-primary" id="btn-submit">
                <span>Vérifier</span>
            </button>
        </form>
        
        <div class="auth-footer auth-footer-spaced">
            <p class="auth-footer-text">
                Besoin d'aide pour décrypter sans la clé ? 
                <a href="{{{URL_CODE_OUTIL_PERMUTATION}}}" class="auth-footer-link">
                    Essayez notre outil de décryptage visuel !
                </a>
            </p>
        </div>
    </div>
</div>
