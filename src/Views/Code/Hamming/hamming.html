<link rel="stylesheet" href="/assets/code/css/hamming.css">

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <span class="material-icons"></span>
      </div>
      <h1>Correction de messages par Hamming</h1>
      <p class="auth-subtitle">Utilisez le carré de Hamming pour corriger un message brouillé.</p>

      {{{FLASH}}}

    </div>

    <form method="post" action="/code/hamming" class="auth-form">
      <input type="hidden" name="type" value="login">

      <div class="form-group">
        <label for="message">
          Entrez le message à corriger :
        </label>
        <input
                type="text"
                name="message"
                id="message"
                placeholder="Entrez le message ici"
                required
                autocomplete="username">
      </div>

      <button type="submit" name="submit" class="btn-auth btn-primary" id="btn-submit">
        <span>Corriger</span>
      </button>
    </form>

    {{{GAME}}}

  </div>
</div>

{{{GAME_SCRIPT}}}
